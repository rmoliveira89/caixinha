<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<meta name="theme-color" content="#0e1118"/>
<title>Gorjeta · A Batataria</title>
<style>
  :root {
    --bg:#0e1118;--card:#141a24;--border:#2c3340;--text:#e6e8ef;--muted:#8b93a7;
    --accent:#f0c14a;--green:#3dcc8a;--blue:#6ab7ff;--red:#ff6b6b;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);min-height:100dvh;display:flex;flex-direction:column;align-items:center;padding:20px 16px 40px;line-height:1.4}
  .wrap{width:100%;max-width:420px}
  .logo{text-align:center;margin-bottom:18px}.logo .emoji{font-size:42px;line-height:1}
  .logo h1{font-size:18px;font-weight:800;margin-top:6px;color:var(--accent)}
  .logo p{font-size:12px;color:var(--muted);margin-top:2px}
  .card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:18px 16px;margin-bottom:14px}
  .card h2{font-size:13px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.04em;margin-bottom:10px}
  .info-row{display:flex;align-items:flex-start;gap:10px;margin-bottom:10px}
  .info-ico{font-size:20px;flex-shrink:0;margin-top:1px}.info-lbl{font-size:11px;color:var(--muted)}
  .info-val{font-size:16px;font-weight:800;color:var(--text);word-break:break-word}
  .valores{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
  .val-btn{appearance:none;border:2px solid var(--border);background:#0e1118;color:var(--text);border-radius:12px;padding:14px 4px;font-size:16px;font-weight:800;cursor:pointer;transition:.15s}
  .val-btn:active{transform:scale(.97)}.val-btn.sel{border-color:var(--accent);background:rgba(240,193,74,.12);color:var(--accent)}
  .livre-box{margin-top:4px}.livre-box label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px}
  .livre-input-wrap{display:flex;align-items:center;gap:8px;background:#0e1118;border:2px solid var(--border);border-radius:12px;padding:4px 12px}
  .livre-input-wrap.focus{border-color:var(--accent)}
  .livre-input-wrap span{font-weight:800;color:var(--muted);font-size:16px}
  .livre-input-wrap input{flex:1;border:none;background:transparent;color:var(--text);font-size:20px;font-weight:800;padding:10px 0;outline:none;width:100%}
  .btn{appearance:none;border:none;border-radius:14px;padding:16px 18px;font-size:16px;font-weight:800;cursor:pointer;width:100%;transition:.15s}
  .btn:active{transform:scale(.98)}.btn:disabled{opacity:.45;cursor:not-allowed}
  .btn-pix{background:linear-gradient(135deg,#32bcad,#1a9b8a);color:#fff;margin-top:14px;box-shadow:0 4px 16px rgba(50,188,173,.25)}
  .btn-copy{background:#1c2433;color:var(--text);border:1px solid var(--border);margin-top:10px}
  .btn-sec{background:transparent;color:var(--muted);border:1px solid var(--border);margin-top:8px;font-size:13px;padding:12px}
  .pix-box{display:none;margin-top:14px;padding-top:14px;border-top:1px solid var(--border)}
  .pix-box.show{display:block}
  .pix-qr{display:flex;justify-content:center;margin:10px 0 14px}
  .pix-qr canvas,.pix-qr img{border-radius:12px;background:#fff;padding:10px;max-width:220px;width:100%}
  .pix-code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;word-break:break-all;background:#0e1118;border:1px solid var(--border);border-radius:10px;padding:10px;color:var(--muted);max-height:100px;overflow:auto}
  .hint{font-size:11px;color:var(--muted);text-align:center;margin-top:12px;line-height:1.5}
  .status{text-align:center;padding:40px 16px;color:var(--muted)}.status .big{font-size:48px;margin-bottom:12px}.status h3{color:var(--text);font-size:18px;margin-bottom:6px}
  .toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);background:#1a2332;border:1px solid var(--green);color:var(--green);padding:12px 20px;border-radius:999px;font-size:13px;font-weight:700;opacity:0;pointer-events:none;transition:.2s;z-index:99;white-space:nowrap}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .obrigado{text-align:center;padding:20px 10px}.obrigado .big{font-size:56px}.obrigado h3{font-size:20px;margin:8px 0 4px;color:var(--green)}
  .input-erro{font-size:12px;color:var(--red);min-height:18px;margin-bottom:8px;text-align:center}

  .build-badge{position:fixed;top:8px;right:10px;z-index:999;font-size:10px;color:#8b93a7;opacity:.65;background:rgba(0,0,0,.35);padding:3px 8px;border-radius:999px;pointer-events:none;letter-spacing:.02em;white-space:nowrap}
  .debug-toast{position:fixed;left:50%;bottom:70px;transform:translateX(-50%);background:#f0c14a;color:#111;padding:8px 14px;border-radius:999px;font-size:12px;font-weight:800;opacity:0;pointer-events:none;transition:.2s;z-index:100}
  .debug-toast.show{opacity:1}
</style>
</head>
<body>
<div class="build-badge" id="buildBadge">modificado em 11/11/2026 00:35</div><div class="debug-toast" id="debugToast"></div>
<div class="wrap" id="app">
  <div class="logo"><div class="emoji">🥔</div><h1>A Batataria</h1><p>Gorjeta para o entregador</p></div>
  <div class="status" id="loading"><div class="big">🛵</div><h3>Carregando…</h3><p>Buscando dados do pedido</p></div>
</div>
<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
<script>
const SUPABASE_URL = "https://umptefufjwvtsoegutet.supabase.co";
const SUPABASE_KEY = "sb_publishable_J-YJjz-t5TTkR5kXtBMAUQ_2xvDEcDY";

let sb=null, linkData=null, entregador=null, valorSel=5, modoLivre=false, pixPayload=null;
let _candidatos=[], _numeroPedidoGate="", _codigoGate="";

function getClient(){ if(sb) return sb; sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY); return sb; }
function toast(msg){ const t=document.getElementById("toast"); if(!t) return; t.textContent=msg; t.classList.add("show"); setTimeout(()=>t.classList.remove("show"),2600); }
function esc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }

function extrairCodigo(){
  const params=new URLSearchParams(location.search);
  let c=params.get("p")||params.get("n")||params.get("pedido")||params.get("c")||params.get("g")||params.get("codigo")||"";
  if(!c && location.search){ const raw=location.search.replace(/^\?/,"").trim(); if(/^\d{1,12}$/.test(raw)) c=raw; }
  if(!c && location.hash){ c=location.hash.replace(/^#\/?/,"").trim(); }
  if(!c){ const parts=location.pathname.split("/").filter(Boolean); const skip=new Set(["index.html","gorjeta.html","404.html","caixinha"]); for(let i=parts.length-1;i>=0;i--){ const seg=parts[i]; if(!skip.has(seg.toLowerCase())){ c=seg; break; } } }
  return String(c||"").trim();
}
function extrairNumeroPedido(codigo){ const s=String(codigo||"").trim(); if(/^\d{1,12}$/.test(s)) return s; const m=s.match(/[-_](\d+)\s*$/); return m?m[1]:null; }

/* CRC16 PIX */
function crc16(str){ let crc=0xffff; for(let i=0;i<str.length;i++){ crc^=str.charCodeAt(i)<<8; for(let j=0;j<8;j++){ crc=(crc & 0x8000)?((crc<<1)^0x1021):(crc<<1); crc&=0xffff; } } return crc.toString(16).toUpperCase().padStart(4,"0"); }
function tlv(id,value){ const v=String(value); const len=String(v.length).padStart(2,"0"); return id+len+v; }
function gerarPixPayload({chave,nome,cidade,valor,txid}){
  const nomeLimpo=String(nome||"ENTREGADOR").normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^A-Za-z0-9 ]/g,"").substring(0,25).trim().toUpperCase()||"ENTREGADOR";
  const cidadeLimpa=String(cidade||"SAO PAULO").normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^A-Za-z0-9 ]/g,"").substring(0,15).trim().toUpperCase()||"SAO PAULO";
  const chaveLimpa=String(chave||"").trim(); if(!chaveLimpa) throw new Error("Chave PIX não cadastrada");
  const valorStr=Number(valor).toFixed(2); const tx=String(txid||"***").replace(/[^A-Za-z0-9]/g,"").substring(0,25)||"***";
  const mai=tlv("00","BR.GOV.BCB.PIX")+tlv("01",chaveLimpa); const additional=tlv("05",tx);
  let payload=""; payload+=tlv("00","01"); payload+=tlv("26",mai); payload+=tlv("52","0000"); payload+=tlv("53","986"); payload+=tlv("54",valorStr); payload+=tlv("58","BR"); payload+=tlv("59",nomeLimpo); payload+=tlv("60",cidadeLimpa); payload+=tlv("62",additional); payload+="6304"; payload+=crc16(payload); return payload;
}

function renderErro(titulo,msg){ document.getElementById("app").innerHTML=`<div class="logo"><div class="emoji">🥔</div><h1>A Batataria</h1></div><div class="status"><div class="big">😕</div><h3>${esc(titulo)}</h3><p>${esc(msg)}</p></div>`; }
function normalizarNome(s){ return String(s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/[^a-z0-9\s]/g," ").replace(/\s+/g," ").trim(); }
function nomesBatem(digitado,cadastrado){ const a=normalizarNome(digitado), b=normalizarNome(cadastrado); if(!a||!b) return false; if(a===b) return true; if(a.length>=3 && (b.indexOf(a)>=0 || a.indexOf(b)>=0)) return true; const ta=a.split(" ").filter(Boolean); const tb=new Set(b.split(" ").filter(Boolean)); if(ta.length>=1 && ta.every(t=>tb.has(t))) return true; return false; }

function renderConfirmacaoNome(numeroPedido){
  document.getElementById("app").innerHTML=`
    <div class="logo"><div class="emoji">🥔</div><h1>A Batataria</h1><p>Gorjeta para o entregador</p></div>
    <div class="card">
      <h2>Confirme o pedido</h2>
      <div class="info-row"><div class="info-ico">🧾</div><div><div class="info-lbl">Número do pedido</div><div class="info-val">#${esc(numeroPedido)}</div></div></div>
      <p style="font-size:13px;color:var(--muted);margin:12px 0 10px;line-height:1.45">Para proteger seus dados, digite o <b style="color:var(--text)">nome do cliente</b> exatamente como está na comanda.</p>
      <label style="font-size:11px;color:var(--muted);display:block;margin-bottom:6px">Nome do cliente na comanda</label>
      <input id="confNomeCliente" type="text" autocomplete="name" placeholder="Ex.: Maria Silva" style="width:100%;padding:14px 12px;border-radius:12px;border:2px solid var(--border);background:#0e1118;color:var(--text);font-size:16px;font-weight:700;outline:none;margin-bottom:8px"/>
      <div id="confNomeErro" class="input-erro"></div>
      <button type="button" class="btn btn-pix" id="btnContinuar">Continuar</button>
    </div>
    <p class="hint">Não mostramos nome do cliente nem do entregador antes desta confirmação.</p>`;
  const input=document.getElementById("confNomeCliente"); const btn=document.getElementById("btnContinuar");
  if(input){ setTimeout(()=>input.focus(),60); input.addEventListener("keydown",(e)=>{ if(e.key==="Enter"){ e.preventDefault(); confirmarNomeCliente(); } }); }
  if(btn) btn.addEventListener("click", confirmarNomeCliente);
}

async function confirmarNomeCliente(){
  const inp=document.getElementById("confNomeCliente"); const err=document.getElementById("confNomeErro");
  const digitado=(inp && inp.value || "").trim();
  if(!digitado){ if(err) err.textContent="Digite o nome do cliente como na comanda."; return; }
  if(err) err.textContent="Verificando…";
  const matches=(_candidatos||[]).filter(c=>nomesBatem(digitado,c.cliente_nome));
  if(!matches.length){ if(err) err.textContent="Nome não confere. Confira na comanda e tente de novo."; if(inp){ inp.focus(); inp.select(); } return; }
  matches.sort((a,b)=>{ const ea=a.entregador_nome?1:0, eb=b.entregador_nome?1:0; if(eb!==ea) return eb-ea; return String(b.created_at||"").localeCompare(String(a.created_at||"")); });
  const escolhido=matches[0];
  linkData={ id:null, codigo:_codigoGate, numero_pedido:String(escolhido.numero_pedido||_numeroPedidoGate), pedido_id:escolhido.id?String(escolhido.id):null, cliente_nome:escolhido.cliente_nome||digitado, entregador_nome:escolhido.entregador_nome||null, ativo:true };
  try{
    const client=getClient();
    if(escolhido.id){ const r=await client.from("gorjeta_links").select("*").eq("pedido_id",String(escolhido.id)).eq("ativo",true).maybeSingle(); if(r.data) Object.assign(linkData,r.data,{ cliente_nome:linkData.cliente_nome, entregador_nome:linkData.entregador_nome||r.data.entregador_nome }); }
    else{ const r=await client.from("gorjeta_links").select("*").eq("numero_pedido",linkData.numero_pedido).eq("ativo",true).order("created_at",{ascending:false}).limit(5); const lista=r.data||[]; const peloNome=lista.find(x=>nomesBatem(digitado,x.cliente_nome)); if(peloNome) Object.assign(linkData,peloNome,{ cliente_nome:linkData.cliente_nome, entregador_nome:linkData.entregador_nome||peloNome.entregador_nome }); }
  }catch(e){ console.warn(e); }
  let nomeEnt=String(linkData.entregador_nome||"").trim();
  if(!nomeEnt){ renderErro("Entregador ainda não definido","O pedido #"+(linkData.numero_pedido||"—")+" ainda não está ligado a um entregador. Tente de novo depois da entrega."); return; }
  try{ const client=getClient(); entregador=await buscarCadastroEntregador(client,nomeEnt,linkData.entregador_id); if(!entregador){ entregador={ nome:nomeEnt, apelido:nomeEnt, chave:null, id:null }; } }catch(e){ console.warn(e); entregador={ nome:nomeEnt, apelido:nomeEnt, chave:null }; }
  renderPagina();
}

async function buscarCadastroEntregador(client,nomeEnt,entregadorId){
  const nome=String(nomeEnt||"").trim(); if(!nome && !entregadorId) return null;
  if(entregadorId){ try{ const r=await client.from("entregadores").select("id,nome,apelido,chave,ativo").eq("id",entregadorId).maybeSingle(); if(r.data) return r.data; }catch(_){} }
  if(nome){
    try{ const r=await client.from("entregadores").select("id,nome,apelido,chave,ativo").ilike("nome","%"+nome+"%").limit(10); if(r.data && r.data.length){ const nk=s=>String(s||"").trim().toLowerCase(); const ex=r.data.find(e=>nk(e.nome)===nk(nome)); return ex||r.data[0]; } }catch(_){}
    try{ const r=await client.from("entregadores").select("id,nome,apelido,chave,ativo").eq("nome",nome).limit(5); if(r.data && r.data.length) return r.data[0]; }catch(_){}
  }
  return null;
}

function renderPagina(){
  const apelido=(entregador && (entregador.apelido||entregador.nome))||linkData.entregador_nome||"Entregador";
  const cliente=linkData.cliente_nome||"Cliente"; const pedido=linkData.numero_pedido||extrairNumeroPedido(linkData.codigo)||"—";
  const temChave=!!(entregador && entregador.chave && String(entregador.chave).trim());
  // CORREÇÃO V3: botão SEMPRE renderizado. Antes, sem chave ele nem aparecia e parecia que "nada fazia".
  document.getElementById("app").innerHTML=`
    <div class="logo"><div class="emoji">🥔</div><h1>A Batataria</h1><p>Gorjeta para o entregador</p></div>
    <div class="card"><h2>Entrega</h2>
      <div class="info-row"><div class="info-ico">🛵</div><div><div class="info-lbl">Entregador</div><div class="info-val">${esc(apelido)}</div></div></div>
      <div class="info-row"><div class="info-ico">👤</div><div><div class="info-lbl">Cliente</div><div class="info-val">${esc(cliente)}</div></div></div>
      <div class="info-row"><div class="info-ico">🧾</div><div><div class="info-lbl">Pedido</div><div class="info-val">#${esc(pedido)}</div></div></div>
    </div>
    <div class="card" id="cardValores"><h2>Escolha o valor da gorjeta</h2>
      <div class="valores" id="valoresGrid">
        <button type="button" class="val-btn" data-v="1">R$ 1</button>
        <button type="button" class="val-btn" data-v="3">R$ 3</button>
        <button type="button" class="val-btn sel" data-v="5">R$ 5</button>
        <button type="button" class="val-btn" data-v="10">R$ 10</button>
      </div>
      <div class="livre-box"><label>Ou digite outro valor (mín. R$ 1)</label>
        <div class="livre-input-wrap" id="livreWrap"><span>R$</span><input id="valorLivre" type="text" inputmode="decimal" autocomplete="off" placeholder="0,00"/></div>
      </div>
      ${`<button type="button" class="btn btn-pix" id="btnGerar">💚 Gerar PIX · R$ ${fmtBRL(valorSel)}</button>
        ${!temChave?`<p style="font-size:12px;color:var(--red);text-align:center;margin-top:8px">⚠️ Chave Pix do entregador ainda não cadastrada. Ao clicar, vou mostrar o motivo.</p>`:``}
        <div class="pix-box" id="pixBox"><div class="hint" style="margin-top:0;margin-bottom:8px">Escaneie o QR Code no app do seu banco<br>ou copie o código Pix abaixo</div><div class="pix-qr"><canvas id="qrCanvas"></canvas><img id="qrImg" style="display:none" alt="QR Pix"/></div><div class="pix-code" id="pixCode"></div><button type="button" class="btn btn-copy" id="btnCopiar">📋 Copiar código Pix</button><button type="button" class="btn btn-sec" id="btnPago">✓ Já paguei a gorjeta</button></div>`}
    </div>
    <p class="hint">A gorjeta é opcional e vai 100% para o entregador.<br>Valor mínimo: R$ 1,00</p>`;

  // --- bind eventos ---
  document.querySelectorAll(".val-btn").forEach(b=>{ b.addEventListener("click",()=>selecionarValor(Number(b.dataset.v))); });
  const livreInput=document.getElementById("valorLivre"); const livreWrap=document.getElementById("livreWrap");
  if(livreInput){ livreInput.addEventListener("focus",ativarLivre); livreInput.addEventListener("input",onLivreInput); livreInput.addEventListener("blur",()=>{ if(livreWrap) livreWrap.classList.remove("focus"); }); }
  const btnGerar=document.getElementById("btnGerar"); if(btnGerar) btnGerar.addEventListener("click",gerarPix);
  const btnCop=document.getElementById("btnCopiar"); if(btnCop) btnCop.addEventListener("click",copiarPix);
  const btnPago=document.getElementById("btnPago"); if(btnPago) btnPago.addEventListener("click",marcarEnviado);
  const btnTent=document.getElementById("btnTentarNovamente"); if(btnTent) btnTent.addEventListener("click",()=>location.reload());
  atualizarBotaoGerar();
}

function fmtBRL(v){ return Number(v).toFixed(2).replace(".",","); }
function atualizarBotaoGerar(){ const b=document.getElementById("btnGerar"); if(!b) return; const ok=Number(valorSel)>=1; b.disabled=!ok; b.textContent=ok?"💚 Gerar PIX · R$ "+fmtBRL(valorSel):"💚 Informe no mínimo R$ 1,00"; }
function esconderPix(){ pixPayload=null; const box=document.getElementById("pixBox"); if(box) box.classList.remove("show"); }

function selecionarValor(v){
  valorSel=Number(v); modoLivre=false;
  document.querySelectorAll(".val-btn").forEach(b=>b.classList.toggle("sel",Number(b.dataset.v)===valorSel));
  const inp=document.getElementById("valorLivre"); if(inp) inp.value="";
  const w=document.getElementById("livreWrap"); if(w) w.classList.remove("focus");
  esconderPix(); atualizarBotaoGerar();
}
function ativarLivre(){
  modoLivre=true; document.querySelectorAll(".val-btn").forEach(b=>b.classList.remove("sel"));
  const w=document.getElementById("livreWrap"); if(w) w.classList.add("focus"); onLivreInput();
}
function onLivreInput(){
  modoLivre=true; const inp=document.getElementById("valorLivre"); let txt=String(inp?inp.value:"").replace(/[^\d.,]/g,"");
  if(txt.indexOf(",")>=0) txt=txt.replace(/\./g,"").replace(",",".");
  const n=parseFloat(txt); valorSel=isFinite(n)?Math.round(n*100)/100:0; esconderPix(); atualizarBotaoGerar();
}
function normalizarChavePix(c){ c=String(c||"").trim(); if(/[@a-zA-Z]/.test(c)) return c; const d=c.replace(/\D/g,""); if(d.length===11 && d.startsWith("55")===false && c.includes("(")) return "+55"+d; if(/^\+?55\d{10,11}$/.test(c.replace(/[\s().-]/g,""))) return "+"+d; return d; }

function gerarPix(){
  const v=Number(valorSel); if(!(v>=1)){ toast("Valor mínimo: R$ 1,00"); return; }
  if(!entregador || !String(entregador.chave||"").trim()){ toast("Chave PIX não cadastrada"); return; }
  const pedido=(linkData && linkData.numero_pedido)||"";
  try{ pixPayload=gerarPixPayload({ chave:normalizarChavePix(entregador.chave), nome:entregador.nome||entregador.apelido, cidade:"CAMPO MOURAO", valor:v, txid:"GORJETA"+pedido }); }
  catch(e){ console.warn(e); toast(e && e.message?e.message:"Não foi possível gerar o PIX"); return; }
  const box=document.getElementById("pixBox"); const code=document.getElementById("pixCode"); const canvas=document.getElementById("qrCanvas");
  if(code) code.textContent=pixPayload; if(box) box.classList.add("show");
  // QR: tenta lib, se falhar usa imagem externa (não trava o fluxo)
  const qrImg=document.getElementById("qrImg");
  try{ if(window.QRCode && canvas){ QRCode.toCanvas(canvas,pixPayload,{width:240,margin:1,errorCorrectionLevel:"M"},(err)=>{ if(err){ console.warn(err); canvas.style.display="none"; if(qrImg){ qrImg.src="https://api.qrserver.com/v1/create-qr-code/?size=240x240&data="+encodeURIComponent(pixPayload); qrImg.style.display="block"; } } else { canvas.style.display="block"; if(qrImg) qrImg.style.display="none"; } }); } else if(qrImg){ qrImg.src="https://api.qrserver.com/v1/create-qr-code/?size=240x240&data="+encodeURIComponent(pixPayload); qrImg.style.display="block"; canvas.style.display="none"; } }
  catch(e){ console.warn(e); if(qrImg){ qrImg.src="https://api.qrserver.com/v1/create-qr-code/?size=240x240&data="+encodeURIComponent(pixPayload); qrImg.style.display="block"; } }
  catch(e){ console.warn(e); }
  if(box && box.scrollIntoView) setTimeout(()=>box.scrollIntoView({behavior:"smooth",block:"start"}),80);
  try{ const client=getClient(); client.from("gorjetas").insert({ numero_pedido:pedido, pedido_id:linkData.pedido_id||null, cliente_nome:linkData.cliente_nome, entregador_nome:entregador.nome||entregador.apelido, entregador_id:entregador.id||null, valor:v, status:"gerado" }).then(()=>{}); }catch(_){}
}
function copiarPix(){ if(!pixPayload){ toast("Gere o PIX primeiro"); return; } navigator.clipboard.writeText(pixPayload).then(()=>toast("Código Pix copiado!")).catch(()=>{ const ta=document.createElement("textarea"); ta.value=pixPayload; document.body.appendChild(ta); ta.select(); document.execCommand("copy"); ta.remove(); toast("Código Pix copiado!"); }); }
function marcarEnviado(){
  try{ const client=getClient(); const pedido=(linkData && linkData.numero_pedido)||""; client.from("gorjetas").insert({ numero_pedido:pedido, pedido_id:linkData.pedido_id||null, cliente_nome:linkData.cliente_nome, entregador_nome:entregador.nome||entregador.apelido, entregador_id:entregador.id||null, valor:Number(valorSel)||0, status:"pago" }).then(()=>{}); }catch(_){}
  const apelido=(entregador && (entregador.apelido||entregador.nome))||linkData.entregador_nome||"Entregador";
  document.getElementById("app").innerHTML=`<div class="logo"><div class="emoji">🥔</div><h1>A Batataria</h1></div><div class="card obrigado"><div class="big">🙏</div><h3>Muito obrigado!</h3><p style="color:var(--muted);font-size:14px">Sua gorjeta vai 100% para ${esc(apelido)}.</p></div>`;
}

async function listarCandidatosPedido(client,numeroPedido){
  const num=String(numeroPedido||"").trim(); if(!num) return []; const mapa=new Map();
  try{ const {data}=await client.from("pedidos_entrega_dia").select("id,numero_pedido,cliente_nome,entregador_nome,entregador_nome_added,status,codigo_informado_em,created_at,data").eq("numero_pedido",num).order("created_at",{ascending:false}).limit(20); (data||[]).forEach(p=>{ const ent=String(p.entregador_nome||p.entregador_nome_added||"").trim()||null; mapa.set(String(p.id),{ id:p.id, numero_pedido:p.numero_pedido, cliente_nome:p.cliente_nome, entregador_nome:ent, created_at:p.created_at, data:p.data, fonte:"pedido" }); }); }catch(e){ console.warn(e); }
  try{ const {data}=await client.from("gorjeta_links").select("*").eq("numero_pedido",num).eq("ativo",true).order("created_at",{ascending:false}).limit(10); (data||[]).forEach(l=>{ const key=l.pedido_id?String(l.pedido_id):("link:"+l.id); if(mapa.has(key)){ const o=mapa.get(key); if(!o.cliente_nome && l.cliente_nome) o.cliente_nome=l.cliente_nome; if(!o.entregador_nome && l.entregador_nome) o.entregador_nome=l.entregador_nome; } else { mapa.set(key,{ id:l.pedido_id||null, numero_pedido:l.numero_pedido, cliente_nome:l.cliente_nome, entregador_nome:l.entregador_nome||null, created_at:l.created_at, fonte:"link", link:l }); } }); }catch(e){ console.warn(e); }
  return Array.from(mapa.values()).filter(c=>String(c.cliente_nome||"").trim());
}


// ===== V3: DELEGAÇÃO GLOBAL - funciona mesmo após innerHTML trocar tudo =====
function debugToast(msg){ const d=document.getElementById("debugToast"); if(!d) return; d.textContent=msg; d.classList.add("show"); setTimeout(()=>d.classList.remove("show"),1200); }
document.addEventListener("click", function(e){
  const valBtn = e.target.closest && e.target.closest(".val-btn");
  if(valBtn){ e.preventDefault(); selecionarValor(Number(valBtn.dataset.v)); debugToast("Valor R$ "+valBtn.dataset.v+" selecionado"); return; }
  const id = e.target.id || (e.target.closest && e.target.closest("button") && e.target.closest("button").id);
  if(id==="btnGerar"){ e.preventDefault(); gerarPix(); return; }
  if(id==="btnCopiar"){ e.preventDefault(); copiarPix(); return; }
  if(id==="btnPago"){ e.preventDefault(); marcarEnviado(); return; }
  if(id==="btnContinuar"){ e.preventDefault(); confirmarNomeCliente(); return; }
  if(id==="btnTentarNovamente"){ e.preventDefault(); location.reload(); return; }
});
document.addEventListener("input", function(e){ if(e.target && e.target.id==="valorLivre"){ onLivreInput(); } });
document.addEventListener("focusin", function(e){ if(e.target && e.target.id==="valorLivre"){ ativarLivre(); } });

async function iniciar(){
  const codigo=extrairCodigo(); if(!codigo){ renderErro("Link inválido","Escaneie o QR Code da comanda para abrir a página de gorjeta."); return; }
  try{
    const client=getClient(); const numDoCodigo=extrairNumeroPedido(codigo); _codigoGate=codigo; _numeroPedidoGate=numDoCodigo||"";
    let numero=numDoCodigo;
    if(!numero){ const {data}=await client.from("gorjeta_links").select("*").eq("codigo",codigo).maybeSingle(); if(data && data.numero_pedido) numero=String(data.numero_pedido); if(data && data.ativo===false){ renderErro("Link desativado","Esta gorjeta não está mais disponível."); return; } }
    if(!numero){ renderErro("Pedido não encontrado","Não foi possível identificar o número do pedido neste link."); return; }
    _numeroPedidoGate=numero;
    _candidatos=await listarCandidatosPedido(client,numero);
    if(!_candidatos.length){ const {data:linkOnly}=await client.from("gorjeta_links").select("*").eq("codigo",codigo).maybeSingle(); if(linkOnly && linkOnly.cliente_nome){ _candidatos=[{ id:linkOnly.pedido_id, numero_pedido:linkOnly.numero_pedido, cliente_nome:linkOnly.cliente_nome, entregador_nome:linkOnly.entregador_nome, created_at:linkOnly.created_at, fonte:"link", link:linkOnly }]; } }
    if(!_candidatos.length){ renderErro("Pedido não encontrado","Não achamos o pedido #"+numero+" no sistema."); return; }
    renderConfirmacaoNome(numero);
  }catch(e){ console.error(e); renderErro("Erro de conexão","Não foi possível carregar os dados. Tente novamente em instantes."); }
}

// Badge de modificação: mostra hora embutida no build + lastModified do navegador
(function(){ try{ var b=document.getElementById("buildBadge"); if(b){ var lm=document.lastModified; if(lm){ var d=new Date(lm); if(!isNaN(d)){ b.textContent="modificado em "+String(d.getDate()).padStart(2,"0")+"/"+String(d.getMonth()+1).padStart(2,"0")+"/"+d.getFullYear()+" "+String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0"); } } } }catch(e){} })();

iniciar();
</script>
