<script>

function esc(s) {
  return String(s == null ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;")
    .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

/**
 * Extrai identificador da URL. Formatos aceitos (do mais simples ao legado):
 *   https://site/caixinha/3815          ← preferido (só o número)
 *   https://site/caixinha/#3815
 *   https://site/caixinha/?3815
 *   https://site/caixinha/?p=3815
 *   https://site/caixinha/?c=token-3815  (legado)
 */
function extrairCodigo() {
  const params = new URLSearchParams(location.search);

  // ?p=3815 | ?n=3815 | ?pedido=3815 | ?c=... | ?g=...
  let c = params.get("p") || params.get("n") || params.get("pedido")
       || params.get("c") || params.get("g") || params.get("codigo") || "";

  // ?3815  (query string só com o número, sem chave)
  if (!c && location.search) {
    const raw = location.search.replace(/^\?/, "").trim();
    if (/^\d{1,12}$/.test(raw)) c = raw;
  }

  // #3815
  if (!c && location.hash) {
    c = location.hash.replace(/^#\/?/, "").trim();
  }

  // /caixinha/3815  ou  /3815  (GitHub Pages: use 404.html = index)
  if (!c) {
    const parts = location.pathname.split("/").filter(Boolean);
    const skip = new Set(["index.html", "gorjeta.html", "404.html", "caixinha"]);
    for (let i = parts.length - 1; i >= 0; i--) {
      const seg = parts[i];
      if (!skip.has(seg.toLowerCase())) { c = seg; break; }
    }
  }
  return String(c || "").trim();
}

/** Número do pedido: código só dígitos, ou sufixo após - / _ */
function extrairNumeroPedido(codigo) {
  const s = String(codigo || "").trim();
  if (/^\d{1,12}$/.test(s)) return s;
  const m = s.match(/[-_](\d+)\s*$/);
  return m ? m[1] : null;
}

/* ---------- CRC16 (para BR Code PIX) ---------- */
function crc16(str) {
  let crc = 0xffff;
  for (let i = 0; i < str.length; i++) {
    crc ^= str.charCodeAt(i) << 8;
    for (let j = 0; j < 8; j++) {
      crc = (crc & 0x8000) ? ((crc << 1) ^ 0x1021) : (crc << 1);
      crc &= 0xffff;
    }
  }
  return crc.toString(16).toUpperCase().padStart(4, "0");
}

function tlv(id, value) {
  const v = String(value);
  const len = String(v.length).padStart(2, "0");
  return id + len + v;
}

/**
 * Gera payload PIX estático (copia e cola) com valor.
 * chave: CPF, CNPJ, e-mail, telefone ou chave aleatória
 */
function gerarPixPayload({ chave, nome, cidade, valor, txid }) {
  const nomeLimpo = String(nome || "ENTREGADOR").normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "").replace(/[^A-Za-z0-9 ]/g, "")
    .substring(0, 25).trim().toUpperCase() || "ENTREGADOR";
  const cidadeLimpa = String(cidade || "SAO PAULO").normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "").replace(/[^A-Za-z0-9 ]/g, "")
    .substring(0, 15).trim().toUpperCase() || "SAO PAULO";
  const chaveLimpa = String(chave || "").trim();
  if (!chaveLimpa) throw new Error("Chave PIX não cadastrada");

  const valorStr = Number(valor).toFixed(2);
  const tx = String(txid || "***").replace(/[^A-Za-z0-9]/g, "").substring(0, 25) || "***";

  const mai = tlv("00", "BR.GOV.BCB.PIX") + tlv("01", chaveLimpa);
  const additional = tlv("05", tx);

  let payload = "";
  payload += tlv("00", "01");                          // Payload Format Indicator
  payload += tlv("26", mai);                           // Merchant Account Information
  payload += tlv("52", "0000");                        // MCC
  payload += tlv("53", "986");                         // BRL
  payload += tlv("54", valorStr);                      // Amount
  payload += tlv("58", "BR");
  payload += tlv("59", nomeLimpo);
  payload += tlv("60", cidadeLimpa);
  payload += tlv("62", additional);
  payload += "6304";
  payload += crc16(payload);
  return payload;
}

/* ---------- UI ---------- */
function renderErro(titulo, msg) {

}

/** Normaliza nome para comparação (minúsculo, sem acento, só letras/números/espaços). */
function normalizarNome(s) {
  return String(s || "")
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "")
    .toLowerCase()
    .replace(/[^a-z0-9\s]/g, " ")
    .replace(/\s+/g, " ")
    .trim();
}

/** Confere se o nome digitado corresponde ao nome da comanda. */
function nomesBatem(digitado, cadastrado) {
  const a = normalizarNome(digitado);
  const b = normalizarNome(cadastrado);
  if (!a || !b) return false;
  if (a === b) return true;
  // aceita se o cliente digitou o nome completo contido no cadastrado (ou o contrário),
  // exigindo pelo menos 3 caracteres para evitar chute trivial
  if (a.length >= 3 && (b.indexOf(a) >= 0 || a.indexOf(b) >= 0)) return true;
  // compara por tokens (todas as palavras digitadas existem no cadastrado)
  const ta = a.split(" ").filter(Boolean);
  const tb = new Set(b.split(" ").filter(Boolean));
  if (ta.length >= 2 && ta.every(t => tb.has(t))) return true;
  return false;
}

      </p>
      <label style="font-size:11px;color:var(--muted);display:block;margin-bottom:6px">Nome do cliente na comanda</label>
      <input id="confNomeCliente" type="text" autocomplete="name" placeholder="Ex.: Maria Silva"
        style="width:100%;padding:14px 12px;border-radius:12px;border:2px solid var(--border);background:#0e1118;color:var(--text);font-size:16px;font-weight:700;outline:none;margin-bottom:8px"
        onkeydown="if(event.key==='Enter'){event.preventDefault();confirmarNomeCliente();}" />
      <div id="confNomeErro" style="font-size:12px;color:var(--red);min-height:18px;margin-bottom:8px;text-align:center"></div>
      <button type="button" class="btn btn-pix" style="margin-top:4px" onclick="confirmarNomeCliente()">Continuar</button>

}

window.confirmarNomeCliente = async function () {
  const inp = document.getElementById("confNomeCliente");
  const err = document.getElementById("confNomeErro");
  const digitado = (inp && inp.value || "").trim();
  if (!digitado) {
    if (err) err.textContent = "Digite o nome do cliente como na comanda.";
    return;
  }
  if (err) err.textContent = "Verificando…";

  const matches = (_candidatos || []).filter(c => nomesBatem(digitado, c.cliente_nome));
  if (!matches.length) {
    if (err) err.textContent = "Nome não confere. Confira na comanda e tente de novo.";
    if (inp) { inp.focus(); inp.select(); }
    return;
  }

  // se vários baterem (mesmo nº + mesmo nome), prioriza o que tem entregador e o mais recente
  matches.sort((a, b) => {
    const ea = a.entregador_nome ? 1 : 0, eb = b.entregador_nome ? 1 : 0;
    if (eb !== ea) return eb - ea;
    return String(b.created_at || "").localeCompare(String(a.created_at || ""));
  });
  const escolhido = matches[0];

  linkData = {
    id: null,
    codigo: _codigoGate,
    numero_pedido: String(escolhido.numero_pedido || _numeroPedidoGate),
    pedido_id: escolhido.id ? String(escolhido.id) : null,
    cliente_nome: escolhido.cliente_nome || digitado,
    entregador_nome: escolhido.entregador_nome || null,
    ativo: true
  };

  // se existir link em gorjeta_links para este pedido, reaproveita id/código
  try {
    const client = getClient();
    let q = client.from("gorjeta_links").select("*").eq("ativo", true).order("created_at", { ascending: false }).limit(5);
    if (escolhido.id) {
      const r = await client.from("gorjeta_links").select("*").eq("pedido_id", String(escolhido.id)).eq("ativo", true).maybeSingle();
      if (r.data) Object.assign(linkData, r.data, {
        cliente_nome: linkData.cliente_nome,
        entregador_nome: linkData.entregador_nome || r.data.entregador_nome
      });
    } else {
      const r = await client.from("gorjeta_links").select("*")
        .eq("numero_pedido", linkData.numero_pedido)
        .eq("ativo", true)
        .order("created_at", { ascending: false })
        .limit(3);
      const lista = r.data || [];
      const peloNome = lista.find(x => nomesBatem(digitado, x.cliente_nome));
      if (peloNome) Object.assign(linkData, peloNome, {
        cliente_nome: linkData.cliente_nome,
        entregador_nome: linkData.entregador_nome || peloNome.entregador_nome
      });
      else if (lista[0] && !lista[0].cliente_nome) Object.assign(linkData, { id: lista[0].id, codigo: lista[0].codigo || linkData.codigo });
    }
  } catch (e) { console.warn(e); }

  let nomeEnt = String(linkData.entregador_nome || "").trim();
  if (!nomeEnt) {
    renderErro(
      "Entregador ainda não definido",
      "O pedido #" + (linkData.numero_pedido || "—") + " ainda não está ligado a um entregador. Tente de novo depois da entrega."
    );
    return;
  }

  try {
    const client = getClient();
    entregador = await buscarCadastroEntregador(client, nomeEnt, linkData.entregador_id);
  } catch (e) {
    console.warn(e);
  }
  renderPagina();
};

      ${temChave ? `

          <p style="font-size:12px">O entregador ainda não informou a chave Pix no sistema.</p>
        </div>
      `}
    </div>

    <p class="hint">A gorjeta é opcional e vai 100% para o entregador.<br>Valor mínimo: R$ 1,00</p>
  `;
}

/* ---------- Escolha do valor + PIX ---------- */
function fmtBRL(v) { return Number(v).toFixed(2).replace(".", ","); }

/** Atualiza o texto/estado do botão "Gerar PIX" conforme o valor escolhido. */
function atualizarBotaoGerar() {
  const b = document.getElementById("btnGerar");
  if (!b) return;
  const ok = Number(valorSel) >= 1;
  b.disabled = !ok;
  b.textContent = ok ? "💚 Gerar PIX · R$ " + fmtBRL(valorSel) : "💚 Informe no mínimo R$ 1,00";
}

/** Mudou o valor: o QR/código que estava na tela deixa de valer. */
function esconderPix() {
  pixPayload = null;
  const box = document.getElementById("pixBox");
  if (box) box.classList.remove("show");
}

window.selecionarValor = function (v) {
  valorSel = Number(v);
  modoLivre = false;
  document.querySelectorAll(".val-btn").forEach(b => b.classList.toggle("sel", Number(b.getAttribute("data-v")) === valorSel));
  const inp = document.getElementById("valorLivre");
  if (inp) inp.value = "";
  const w = document.getElementById("livreWrap");
  if (w) w.classList.remove("focus");
  esconderPix();
  atualizarBotaoGerar();
};

window.ativarLivre = function () {
  modoLivre = true;
  document.querySelectorAll(".val-btn").forEach(b => b.classList.remove("sel"));
  const w = document.getElementById("livreWrap");
  if (w) w.classList.add("focus");
  const inp = document.getElementById("valorLivre");
  if (inp && !inp._blurLigado) {
    inp._blurLigado = true;
    inp.addEventListener("blur", () => { if (w) w.classList.remove("focus"); });
  }
  window.onLivreInput();
};

window.onLivreInput = function () {
  modoLivre = true;
  const inp = document.getElementById("valorLivre");
  let txt = String(inp ? inp.value : "").replace(/[^\d.,]/g, "");        // aceita 7,5 ou 7.5
  if (txt.indexOf(",") >= 0) txt = txt.replace(/\./g, "").replace(",", ".");   // 1.234,50 -> 1234.50
  const n = parseFloat(txt);
  valorSel = isFinite(n) ? Math.round(n * 100) / 100 : 0;
  esconderPix();
  atualizarBotaoGerar();
};

/** Chave PIX como vem no cadastro -> formato aceito pelo BR Code (CPF/CNPJ só dígitos, telefone +55…, e-mail/aleatória como está). */
function normalizarChavePix(c) {
  c = String(c || "").trim();
  if (/[@a-zA-Z]/.test(c)) return c;                 // e-mail ou chave aleatória
  const d = c.replace(/\D/g, "");
  if (/^\+?55\d{10,11}$/.test(c.replace(/[\s().-]/g, ""))) return "+" + d;   // já com 55
  if (c.indexOf("(") >= 0) return "+55" + d;         // telefone formatado (44) 99999-9999
  return d;                                          // CPF / CNPJ
}

window.gerarPix = function () {
  const v = Number(valorSel);
  if (!(v >= 1)) { toast("Valor mínimo: R$ 1,00"); return; }
  if (!entregador || !String(entregador.chave || "").trim()) { toast("Chave PIX não cadastrada"); return; }
  const pedido = (linkData && linkData.numero_pedido) || "";
  try {
    pixPayload = gerarPixPayload({
      chave: normalizarChavePix(entregador.chave),
      nome: entregador.nome || entregador.apelido,
      cidade: "CAMPO MOURAO",
      valor: v,
      txid: "GORJETA" + pedido
    });
  } catch (e) {
    console.warn(e);
    toast(e && e.message ? e.message : "Não foi possível gerar o PIX");
    return;
  }
  const box = document.getElementById("pixBox");
  const code = document.getElementById("pixCode");
  const canvas = document.getElementById("qrCanvas");
  if (code) code.textContent = pixPayload;
  if (box) box.classList.add("show");
  try {
    if (window.QRCode && canvas) {
      QRCode.toCanvas(canvas, pixPayload, { width: 220, margin: 1, errorCorrectionLevel: "M" }, function (err) {
        if (err) { console.warn(err); if (canvas.parentNode) canvas.parentNode.style.display = "none"; }
      });
    } else if (canvas && canvas.parentNode) {
      canvas.parentNode.style.display = "none";      // biblioteca do QR não carregou: fica o "copia e cola"
    }
  } catch (e) { console.warn(e); }
  if (box && box.scrollIntoView) setTimeout(() => box.scrollIntoView({ behavior: "smooth", block: "start" }), 60);
};

window.copiarPix = async function () {
  if (!pixPayload) { toast("Gere o PIX primeiro"); return; }
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      await navigator.clipboard.writeText(pixPayload);
    } else {
      throw new Error("sem clipboard");
    }
    toast("Código Pix copiado!");
  } catch (e) {
    try {
      const ta = document.createElement("textarea");
      ta.value = pixPayload;
      ta.style.cssText = "position:fixed;left:-9999px;top:0;opacity:0";
      document.body.appendChild(ta);
      ta.focus(); ta.select();
      const ok = document.execCommand("copy");
      document.body.removeChild(ta);
      toast(ok ? "Código Pix copiado!" : "Toque e segure o código para copiar");
    } catch (e2) { toast("Toque e segure o código para copiar"); }
  }
};

window.marcarEnviado = function () {
  const apelido = (entregador && (entregador.apelido || entregador.nome)) || (linkData && linkData.entregador_nome) || "o entregador";
  document.getElementById("app").innerHTML = `
    <div class="logo"><div class="emoji">🥔</div><h1>A Batataria</h1></div>
    <div class="card obrigado">
      <div class="big">🙏</div>
      <h3>Muito obrigado!</h3>
      <p style="color:var(--muted);font-size:14px">Sua gorjeta vai 100% para ${esc(apelido)}.</p>
    </div>`;
};

/** Lista candidatos do mesmo número de pedido (pode haver mais de um no dia). */
async function listarCandidatosPedido(client, numeroPedido) {
  const num = String(numeroPedido || "").trim();
  if (!num) return [];
  const mapa = new Map(); // key = id ou nome+created

  try {
    const { data } = await client
      .from("pedidos_entrega_dia")
      .select("id,numero_pedido,cliente_nome,entregador_nome,entregador_nome_added,status,codigo_informado_em,created_at,data")
      .eq("numero_pedido", num)
      .order("created_at", { ascending: false })
      .limit(20);
    (data || []).forEach(p => {
      const ent = String(p.entregador_nome || p.entregador_nome_added || "").trim() || null;
      mapa.set(String(p.id), {
        id: p.id,
        numero_pedido: p.numero_pedido,
        cliente_nome: p.cliente_nome,
        entregador_nome: ent,
        created_at: p.created_at,
        data: p.data,
        fonte: "pedido"
      });
    });
  } catch (e) { console.warn(e); }

  try {
    const { data } = await client
      .from("gorjeta_links")
      .select("*")
      .eq("numero_pedido", num)
      .eq("ativo", true)
      .order("created_at", { ascending: false })
      .limit(10);
    (data || []).forEach(l => {
      const key = l.pedido_id ? String(l.pedido_id) : ("link:" + l.id);
      if (mapa.has(key)) {
        const o = mapa.get(key);
        if (!o.cliente_nome && l.cliente_nome) o.cliente_nome = l.cliente_nome;
        if (!o.entregador_nome && l.entregador_nome) o.entregador_nome = l.entregador_nome;
      } else {
        mapa.set(key, {
          id: l.pedido_id || null,
          numero_pedido: l.numero_pedido,
          cliente_nome: l.cliente_nome,
          entregador_nome: l.entregador_nome || null,
          created_at: l.created_at,
          fonte: "link",
          link: l
        });
      }
    });
  } catch (e) { console.warn(e); }

  return Array.from(mapa.values()).filter(c => String(c.cliente_nome || "").trim());
}

async function resolverEntregadorDoPedido(client, numeroPedido) {
  const num = String(numeroPedido || "").trim();
  if (!num) return null;
  try {
    const { data, error } = await client
      .from("pedidos_entrega_dia")
      .select("id,numero_pedido,cliente_nome,entregador_nome,entregador_nome_added,status,codigo_informado_em,created_at")
      .eq("numero_pedido", num)
      .order("created_at", { ascending: false })
      .limit(5);
    if (error || !data || !data.length) return null;
    const comEnt = data.filter(p => String(p.entregador_nome || p.entregador_nome_added || "").trim());
    const p = comEnt[0] || data[0];
    const nome = String(p.entregador_nome || p.entregador_nome_added || "").trim();
    return {
      pedido: p,
      entregador_nome: nome || null,
      cliente_nome: p.cliente_nome || null,
      pedido_id: p.id ? String(p.id) : null
    };
  } catch (e) {
    console.warn("resolverEntregadorDoPedido", e);
    return null;
  }
}

async function buscarCadastroEntregador(client, nomeEnt, entregadorId) {
  const nome = String(nomeEnt || "").trim();
  if (!nome && !entregadorId) return null;
  let ents = [];
  if (nome) {
    const r = await client.from("entregadores")
      .select("id,nome,apelido,chave,ativo")
      .ilike("nome", nome)
      .limit(8);
    ents = r.data || [];
  }
  if ((!ents || !ents.length) && entregadorId) {
    const r = await client.from("entregadores")
      .select("id,nome,apelido,chave,ativo")
      .eq("id", entregadorId)
      .maybeSingle();
    if (r.data) ents = [r.data];
  }
  if (!ents || !ents.length) return null;
  const nk = s => String(s || "").trim().toLowerCase();
  return (nome ? ents.find(e => nk(e.nome) === nk(nome)) : null) || ents[0];
}

async function iniciar() {
  const codigo = extrairCodigo();
  if (!codigo) {
    renderErro("Link inválido", "Escaneie o QR Code da comanda para abrir a página de gorjeta.");
    return;
  }

  try {
    const client = getClient();
    const numDoCodigo = extrairNumeroPedido(codigo);
    _codigoGate = codigo;
    _numeroPedidoGate = numDoCodigo || "";

    // descobre o número do pedido (código ou link)
    let numero = numDoCodigo;
    if (!numero) {
      const { data } = await client.from("gorjeta_links").select("*").eq("codigo", codigo).maybeSingle();
      if (data && data.numero_pedido) numero = String(data.numero_pedido);
      if (data && data.ativo === false) {
        renderErro("Link desativado", "Esta gorjeta não está mais disponível.");
        return;
      }
    }
    if (!numero) {
      renderErro("Pedido não encontrado", "Não foi possível identificar o número do pedido neste link.");
      return;
    }
    _numeroPedidoGate = numero;

    // candidatos com o mesmo número (pode haver 2 no mesmo dia)
    _candidatos = await listarCandidatosPedido(client, numero);
    if (!_candidatos.length) {
      // último recurso: link sem cliente no banco de pedidos
      const { data: linkOnly } = await client.from("gorjeta_links").select("*")
        .eq("codigo", codigo).maybeSingle();
      if (linkOnly && linkOnly.cliente_nome) {
        _candidatos = [{
          id: linkOnly.pedido_id,
          numero_pedido: linkOnly.numero_pedido,
          cliente_nome: linkOnly.cliente_nome,
          entregador_nome: linkOnly.entregador_nome,
          created_at: linkOnly.created_at,
          fonte: "link",
          link: linkOnly
        }];
      }
    }

    if (!_candidatos.length) {
      renderErro("Pedido não encontrado", "Não achamos o pedido #" + numero + " no sistema.");
      return;
    }

    // NÃO mostra cliente/entregador ainda — pede confirmação do nome
    renderConfirmacaoNome(numero);
  } catch (e) {
    console.error(e);
    renderErro("Erro de conexão", "Não foi possível carregar os dados. Tente novamente em instantes.");
  }
}

iniciar();
</script>
